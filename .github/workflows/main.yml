name: Vision QC and Android research APK

on:
  push:
    branches: [main, master, upgrade/vision-fusion-qc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Exercise beginner CPU setup on Windows
        shell: cmd
        run: |
          copy tools\pc_brain\windows\01_CAI_DAT_PC.bat .
          copy tools\pc_brain\windows\requirements-pc-cpu.txt .
          call 01_CAI_DAT_PC.bat --no-pause
      - name: Native Windows dependency smoke check
        shell: cmd
        run: .venv\Scripts\python.exe tools\pc_brain\windows\smoke_cpu.py

  data-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/vision_qc/requirements-qc.txt
      - run: python -m pip install -r tools/vision_qc/requirements-qc.txt -r tools/vision_qc/requirements-colab-qc.txt
      - name: Dataset, normalization and release-gate regression tests
        run: python -W error::ResourceWarning -m unittest discover -s tools/vision_qc -t . -p 'test_*.py' -v
      - name: PC runtime, transport and shadow tests without Windows or ORT
        run: python -m unittest discover -s tools/pc_brain -t . -p 'test_*.py' -v
      - name: Compile PC Brain entrypoint without importing Windows/ONNX dependencies
        run: python -m compileall -q tools/pc_brain

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: efootball-fixed-debug-keystore-v2
      - name: Create a debug key if the cache is unavailable
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Core regression tests, Android lint and APK
        run: gradle :vision-core:test :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify standalone PC HUD identity and APK signing
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p app/build/reports
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > app/build/reports/apk-identity.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > app/build/reports/apk-signing.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('app/build/reports/apk-identity.txt').read_text()
          assert re.search(r"package: name='com.example.minimap.pchud' versionCode='3'", text), text
          assert "launchable-activity: name='com.example.minimap.ui.PcHudActivity'" in text, text
          print('Verified separate PC HUD package and unchanged Activity namespace')
          PY
          sha256sum "$apk" > app/build/reports/apk-sha256.txt
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-qc-reports
          path: |
            vision-core/build/reports/tests/test/
            vision-core/build/test-results/test/
            app/build/reports/lint-results-debug.*
            app/build/reports/apk-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: efootphy-research-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

