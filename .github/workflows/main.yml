name: Build eFootball AR Vision APK v4.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Cài đặt Android SDK 35 & Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 4. Cố định chữ ký APK (Cài đè không cần gỡ bản cũ)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: efootball-fixed-debug-keystore-v2

      - name: 5. Khởi tạo Keystore nếu chưa có
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 6. Cài đặt Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 7. Biên dịch APK v4.0 Real-Time 60FPS
        run: |
          if [ -d "efootball-minimap-assistant" ]; then
            cd efootball-minimap-assistant
          fi
          gradle assembleDebug --stacktrace

      - name: 8. Đóng gói file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: eFootball-RealTime-Vision-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
