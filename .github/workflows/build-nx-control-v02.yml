name: Build NX Control Center v0.2

on:
  workflow_dispatch:
  push:
    branches: [ nx-control-center-v02 ]
    paths:
      - 'nxcontrol/**'
      - '.github/workflows/build-nx-control-v02.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: nxcontrol
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NX-Control-Center-v0.2.0-APK
          path: nxcontrol/app/build/outputs/apk/release/app-release.apk
