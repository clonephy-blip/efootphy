name: Build NX Control Center v0.2

on:
  workflow_dispatch:
  push:
    branches: [ nx-control-center-v02 ]
    paths:
      - 'nxcontrol/**'
      - '.github/workflows/build-nx-control-v02.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36 from preinstalled sdkmanager
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        working-directory: nxcontrol
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace
      - name: Show APK output
        run: ls -lah nxcontrol/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: NX-Control-Center-v0.2.0-SIGNED
          path: nxcontrol/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
